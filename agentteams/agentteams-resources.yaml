# AgentTeams v1beta1 resources.
#
# Apply order matters: Worker CRs first, then Human, then Team. The Team owns only membership and
# collaboration context. Model, runtime, Skills, MCP access, package and lifecycle belong to each
# standalone Worker CR, matching the current agentscope-ai/AgentTeams API.

apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: energymesh-team-leader
spec:
  workerName: energymesh-team-leader
  model: deepseek-chat
  runtime: openclaw
  identity: >-
    EnergyMesh Team Leader. Owns AgentTeams project planning, dynamic task DAGs, delegation,
    progress supervision, revision, human escalation and final acceptance for park dispatch.
  package: file://./agentteams/team-leader
  skills:
    - microgrid_context_ingest
    - approval_rollback
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: perception-worker
spec:
  workerName: perception-worker
  model: deepseek-chat
  runtime: copaw
  identity: >-
    Read-only energy context Worker. Validates telemetry, forecasts, tariffs, device state and
    production constraints, and decides whether an existing plan remains valid.
  package: file://./agentteams/workers/perception
  skills:
    - microgrid_context_ingest
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: dispatch-worker
spec:
  workerName: dispatch-worker
  model: deepseek-chat
  runtime: copaw
  identity: >-
    Dispatch proposal Worker. Uses trusted snapshots and deterministic optimization tools to
    produce versioned candidate plans, but cannot audit, approve or execute them.
  package: file://./agentteams/workers/dispatch
  skills:
    - dispatch_plan_generate
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: audit-worker
spec:
  workerName: audit-worker
  model: deepseek-chat
  runtime: openclaw
  identity: >-
    Independent fail-closed audit Worker. Recomputes physical, production, authorization and
    baseline-improvement constraints without accepting the Dispatch Worker's conclusions.
  package: file://./agentteams/workers/audit
  skills:
    - dispatch_audit_verify
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: execution-worker
spec:
  workerName: execution-worker
  model: deepseek-chat
  runtime: copaw
  identity: >-
    Simulation-only execution Worker. Accepts only the currently audited and, when required,
    human-approved plan version; verifies readback and requests rollback on deviation.
  package: file://./agentteams/workers/execution
  skills:
    - execution_mapping
    - approval_rollback
  state: Running
---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: park-operator
spec:
  displayName: Park Operator
  email: operator@example.com
  permissionLevel: 2
  accessibleTeams:
    - energymesh-park-control
  accessibleWorkers: []
  note: Human approver for production-impacting or otherwise high-risk dispatch actions.
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: energymesh-park-control
spec:
  teamName: energymesh-park-control
  description: >-
    AgentTeams-native park energy decision team with dynamic delegation, independent audit,
    human approval, execution verification and rollback.
  heartbeatEvery: 5m
  peerMentions: true
  workerMembers:
    - name: energymesh-team-leader
      role: team_leader
    - name: perception-worker
      role: worker
    - name: dispatch-worker
      role: worker
    - name: audit-worker
      role: worker
    - name: execution-worker
      role: worker
