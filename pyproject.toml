[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energymesh-agents"
version = "0.1.0"
description = "Audited multi-agent economic dispatch for commercial PV and battery sites"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "openai>=1.59,<2",
  "pydantic>=2.8,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
cloud = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
energymesh = "energymesh.api:run"
energymesh-mcp = "energymesh.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energymesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["energymesh"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
