<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnergyMesh AgentTeams Watchdog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 13px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.green {
    background: #3fb950;
    box-shadow: 0 0 8px #3fb950;
  }
  .status-dot.yellow {
    background: #d29922;
    box-shadow: 0 0 8px #d29922;
  }
  .status-dot.red {
    background: #f85149;
    box-shadow: 0 0 8px #f85149;
  }
  .status-text { font-weight: 600; }
  .status-text.green { color: #3fb950; }
  .status-text.yellow { color: #d29922; }
  .status-text.red { color: #f85149; }
  .spacer { flex: 1; }
  .action-btn {
    background: #238636;
    color: white;
    border: none;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    opacity: 0.6;
    pointer-events: none;
  }
  .action-btn.active {
    opacity: 1;
    pointer-events: auto;
  }
  .action-btn.active:hover { background: #2ea043; }
  .log-panel {
    font-size: 11px;
    font-family: "SF Mono", "Monaco", "Inconsolata", monospace;
    color: #8b949e;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .main {
    flex: 1;
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(13,17,23,0.95);
    z-index: 10;
    gap: 20px;
  }
  .overlay h2 {
    font-size: 20px;
    color: #f85149;
  }
  .overlay p {
    color: #8b949e;
    font-size: 14px;
  }
  .overlay .retry-btn {
    background: #238636;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .overlay .retry-btn:hover { background: #2ea043; }
  .overlay .countdown {
    font-family: monospace;
    color: #d29922;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="status-bar" id="statusBar">
  <div class="status-dot red" id="statusDot"></div>
  <div class="status-text red" id="statusText">Codespace 休眠中</div>
  <div class="spacer"></div>
  <div class="log-panel" id="logPanel">等待检测...</div>
  <button class="action-btn" id="wakeBtn" onclick="forceWake()">唤醒 Codespace</button>
</div>

<div class="main" id="main">
  <div class="overlay" id="overlay">
    <h2>🔴 AgentTeams 服务离线</h2>
    <p>Codespace 已休眠，Element 页面暂时无法加载。</p>
    <div class="countdown" id="countdown">10 秒后自动重试...</div>
    <button class="retry-btn" id="retryBtn" onclick="checkAndLoad()">立即重试</button>
  </div>
  <iframe id="elementFrame" src=""></iframe>
</div>

<script>
const MATRIX_URL = 'http://127.0.0.1:18080/_matrix/client/versions';
const ELEMENT_URL = 'http://127.0.0.1:18088/#/room/#agentteams-manager-default:matrix-local.agentteams.io:18080';
const CHECK_INTERVAL = 30000; // 30 秒检测一次
const WAKE_RETRY_INTERVAL = 10000; // 休眠时每 10 秒唤醒一次
const PING_INTERVAL = 300000; // 每 5 分钟主动 ping，保持流量

let connected = false;
let autoRetryTimer = null;
let pingTimer = null;
let checkTimer = null;

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;
  txt.className = 'status-text ' + state;
  txt.textContent = text;
}

function log(msg) {
  const el = document.getElementById('logPanel');
  const time = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  el.textContent = `[${time}] ${msg}`;
}

async function probeMatrix() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(MATRIX_URL, { method: 'GET', signal: ctrl.signal, mode: 'no-cors' });
    clearTimeout(timer);
    // no-cors 下 res.ok 不可靠，用 res.type 判断：opaque 说明请求发出了
    return res.type === 'opaque' || res.ok || res.status === 0;
  } catch (e) {
    return false;
  }
}

async function checkAndLoad() {
  clearTimeout(autoRetryTimer);
  log('检测 Matrix 连接...');

  const ok = await probeMatrix();

  if (ok) {
    if (!connected) {
      connected = true;
      setStatus('green', '🟢 服务在线');
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('elementFrame').src = ELEMENT_URL;
      document.getElementById('wakeBtn').classList.remove('active');
      log('Matrix 连通，加载 Element...');
      startPing();
    } else {
      log('心跳 OK，服务在线');
    }
  } else {
    connected = false;
    setStatus('red', '🔴 连接断开');
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('elementFrame').src = '';
    document.getElementById('wakeBtn').classList.add('active');
    log('Matrix 无响应，等待重试...');
    startCountdown(WAKE_RETRY_INTERVAL / 1000);
  }
}

function startCountdown(seconds) {
  const el = document.getElementById('countdown');
  let remaining = seconds;
  el.textContent = `${remaining} 秒后自动重试...`;
  const timer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timer);
    } else {
      el.textContent = `${remaining} 秒后自动重试...`;
    }
  }, 1000);
  autoRetryTimer = setTimeout(() => {
    checkAndLoad();
  }, seconds * 1000);
}

function forceWake() {
  log('触发唤醒请求...');
  // 多发几次请求，增加唤醒概率
  probeMatrix();
  setTimeout(() => probeMatrix(), 2000);
  setTimeout(() => probeMatrix(), 4000);
  setTimeout(() => checkAndLoad(), 6000);
}

function startPing() {
  clearInterval(pingTimer);
  pingTimer = setInterval(async () => {
    if (!connected) return;
    log('发送心跳...');
    const ok = await probeMatrix();
    if (!ok) {
      log('心跳丢失，标记离线');
      connected = false;
      setStatus('yellow', '🟡 连接不稳');
    }
  }, PING_INTERVAL);
}

function startCheckLoop() {
  checkTimer = setInterval(checkAndLoad, CHECK_INTERVAL);
}

// 页面加载时先检测一次，再进入循环
window.onload = () => {
  checkAndLoad();
  startCheckLoop();
};

// 页面可见性变化时恢复检测
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !connected) {
    checkAndLoad();
  }
});
</script>

</body>
</html>
